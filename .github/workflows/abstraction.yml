name: Source Abstraction

# The pre-commit hook is the fast feedback; this is the one that cannot be skipped
# with --no-verify, and it reads commit messages as well as the tree.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the pushed range
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # A branch's first push has no before-sha, so check its whole history.
            BASE=$(git rev-list --max-parents=0 "$HEAD" | tail -1)
          fi
          node scripts/check-abstraction.mjs --range "$BASE..$HEAD"
